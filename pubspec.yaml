name: finantech
description: Aplicativo simples para controle de gastos mensais usando SQLite.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Ícones do Material Design
  cupertino_icons: ^2.0.0
  
  # SQLite para armazenamento local
  sqflite: ^2.3.0
  
  # Para obter o caminho do diretório do app
  path_provider: ^2.1.1
  
  # Utilitário para trabalhar com caminhos
  path: ^1.8.3
  
  # Formatação de valores monetários
  intl: ^0.20.3
  
  # Persistência de preferências do usuário
  shared_preferences: ^2.2.2
  
  # Notificações locais
  flutter_local_notifications: ^23.0.0
  
  # Timezone para agendamento de notificações
  timezone: ^0.11.2
  
  # Seletor de arquivos
  file_picker: ^13.3.2
  
  # Compartilhar arquivos
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # SQLite para testes em desktop/CI
  sqflite_common_ffi: ^2.3.3
  
  # Gerador de ícones do app
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  
  assets:
    - assets/images/
